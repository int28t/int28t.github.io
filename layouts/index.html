{{ define "main" }}
<div class="home">
    {{ .Content }}
    <ul class="posts">
        <!-- Перебираем все страницы из папки content/posts/ -->
        {{ range (where .Site.RegularPages "Section" "posts") }}
        <li>
            <span class="post-date">{{ .Date.Format "Jan 2, 2006" }}</span>
            <a class="post-link" href="{{ .Permalink }}">{{ .Title }}</a>
        </li>
        {{ end }}
    </ul>
</div>
{{ end }}
